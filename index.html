<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NDA Coaching Elite</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body {
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}
header{
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header h1{
  font-size:20px;
}
nav a{
  margin:0 10px;
  text-decoration:none;
  color:white;
  opacity:0.8;
}
.hero{
  text-align:center;
  padding:80px 20px;
}
.hero h2{
  font-size:40px;
}
.hero p{
  opacity:0.7;
}
.btn{
  margin-top:20px;
  padding:12px 25px;
  border:none;
  border-radius:30px;
  background:linear-gradient(45deg,#38bdf8,#6366f1);
  color:white;
  cursor:pointer;
  transition:0.3s;
}
.btn:hover{
  transform:scale(1.1);
}
.section{
  padding:50px 20px;
  text-align:center;
}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  margin-top:30px;
}
.card{
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:20px;
  backdrop-filter:blur(10px);
}
footer{
  text-align:center;
  padding:20px;
  opacity:0.6;
}
</style>
</head>
<body>
<header>
  <h1>NDA Elite</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Courses</a>
    <a href="#">Contact</a>
  </nav>
</header><section class="hero">
  <h2>Crack NDA with Confidence</h2>
  <p>Join India's smartest NDA preparation platform</p>
  <button class="btn">Start Now</button>
</section><section class="section">
  <h2>Our Features</h2>
  <div class="cards">
    <div class="card">Mock Tests</div>
    <div class="card">Expert Mentors</div>
    <div class="card">Performance Tracking</div>
  </div>
</section><section class="section">
  <h2>Contact Us</h2>
  <p>Email: ndaelite@gmail.com</p>
</section><footer>
  <p>© 2026 NDA Elite</p>
</footer>
</body>
  </html>
